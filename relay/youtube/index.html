<!doctype html>
<!--
  YouTube embed relay for the Acceler8zone landing page.
  Why: YouTube plays an embedded video only when it sees a web address (else Error 153). The landing page opened
  as a file or in a preview has none; this page lives on an https address and hosts the player for it.
  Use: <iframe src="https://<pages-host>/relay/youtube/?v=VIDEO_ID&autoplay=1" allow="autoplay; fullscreen; picture-in-picture; encrypted-media">
  Adapted from Bart, https://stackoverflow.com/a/79810109 (retrieved 2026-11-17), licence CC BY-SA 4.0.
  Changes: the video ID is checked (11 letters, digits, - or _), the page cannot be framed for other video hosts.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex" />
  <title>Video</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    p { margin: 0; padding: 24px; }
  </style>
</head>
<body>
  <iframe id="player" title="Video"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
    allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const u = new URL(location.href);
    const v = u.searchParams.get('v') || '';
    if (!/^[A-Za-z0-9_-]{11}$/.test(v)) { document.body.innerHTML = '<p>Missing or invalid video.</p>'; }
    else {
      const params = new URLSearchParams({
        enablejsapi: '1', rel: '0', playsinline: u.searchParams.get('playsinline') || '1',
        autoplay: u.searchParams.get('autoplay') === '1' ? '1' : '0', origin: location.origin
      });
      document.getElementById('player').src = 'https://www.youtube-nocookie.com/embed/' + v + '?' + params;
    }
  </script>
</body>
</html>
